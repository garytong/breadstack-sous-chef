# Shared subworkflows of souschef-drift and souschef-retrain (workflows.tf
# appends this file to each definition; Workflows has no imports).
#
# Conventions:
#   - every Google API call goes through api_get / api_send with OAuth2 (the
#     workflow's own account, souschef-workflow); reads, deletes, conditional
#     writes and requests idempotent by id are retried on what Google calls
#     transient (retry_transient: 408, 429, 5xx, connection and timeout
#     errors), other POST / PATCH only where they cannot have been applied
#     (Workflows' non-idempotent policy); GPU services are called with an
#     OIDC token whose audience is the service URL
#   - GCS JSON objects through gcs_* (data between steps travels as GCS paths:
#     Workflows variables are limited to 512 KB)
#   - a stage error is raised as a map {pipeline_stage, message, error_class,
#     attempt, attempts, execution?, exit_code?}; err_text scrubs keys and
#     tokens out of every message that leaves the workflow
#   - the thermometer key is read by `notify` / `thermometer_decision`
#     themselves, used in one header and never returned or logged

# ---- configuration ---------------------------------------------------------------

load_config:
  steps:
    - read:
        call: gcs_read
        args:
          bucket: '${sys.get_env("PIPELINE_BUCKET")}'
          name: '${sys.get_env("PIPELINE_CONFIG")}'
        result: cfg
    - check:
        switch:
          - condition: '${cfg == null}'
            raise:
              pipeline_stage: "config"
              error_class: "config_missing"
              message: "infra/config.json is missing from the pipeline bucket (terraform apply of infra/envs/int writes it)"
              attempt: 1
              attempts: 1
    - done:
        return: '${cfg}'

# ---- small helpers -----------------------------------------------------------------

log:
  params: [text, severity: "INFO"]
  steps:
    - write:
        call: sys.log
        args:
          text: '${text}'
          severity: '${severity}'

run_stamp:
  # 2026-10-12T03:10:05Z in execution 8a0cc8ec-… -> 20261012-0310-8a0cc8: the
  # time stamp of a run id, unique beyond the minute (two executions in one
  # minute, a scheduler retry or a manual run, would otherwise share GCS
  # paths and thermometer ids, and the second one's messages read as
  # duplicates). The execution id is a lowercase UUID.
  steps:
    - fmt:
        assign:
          - t: '${text.substring(time.format(sys.now()), 0, 16)}'
          - t: '${text.replace_all(text.replace_all(text.replace_all(t, "-", ""), ":", ""), "T", "-")}'
          - x: '${text.replace_all(default(sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID"), ""), "-", "") + "000000"}'
    - done:
        return: '${t + "-" + text.to_lower(text.substring(x, 0, 6))}'

api_time:
  # time.parse of a Google API timestamp: Workflows parses at most
  # microseconds (stdlib/time/parse), some APIs send nanoseconds
  # (2026-10-13T04:43:10.336255123Z); the fraction is cut to 6 digits.
  params: [s]
  steps:
    - cut:
        switch:
          - condition: '${text.match_regex(s, "^[^.]+\\.[0-9]{7,}Z$")}'
            assign:
              - p: '${text.split(s, ".")}'
              - s: '${p[0] + "." + text.substring(p[1], 0, 6) + "Z"}'
    - done:
        return: '${time.parse(s)}'

err_text:
  # A safe, short string for an exception or a message: keys, tokens and
  # signed-URL parameters are replaced, the rest truncated to 1500 chars.
  params: [e]
  steps:
    - base:
        assign:
          - msg: ""
    - pick:
        switch:
          - condition: '${get_type(e) == "string"}'
            assign:
              - msg: '${e}'
          - condition: '${get_type(e) == "map" and "message" in e and get_type(e.message) == "string"}'
            assign:
              - msg: '${e.message}'
          - condition: true
            assign:
              - msg: '${json.encode_to_string(e)}'
    - body:
        switch:
          - condition: '${get_type(e) == "map" and "body" in e and e.body != null}'
            assign:
              - msg: '${msg + " | " + json.encode_to_string(e.body)}'
    - scrub:
        assign:
          - msg: '${text.replace_all_regex(msg, "tm_[A-Za-z0-9_\\-]+", "tm_<redacted>")}'
          - msg: '${text.replace_all_regex(msg, "sk-ant-[A-Za-z0-9_\\-]+", "<redacted>")}'
          - msg: '${text.replace_all_regex(msg, "ya29\\.[A-Za-z0-9._\\-]+", "<redacted>")}'
          - msg: '${text.replace_all_regex(msg, "(?i)bearer\\s+[A-Za-z0-9._~+/=\\-]+", "Bearer <redacted>")}'
          - msg: '${text.replace_all_regex(msg, "(?i)(x-api-key|api[_-]?key|service[_-]?key|access_token|token|secret|signature|sig)([\"'':= ]+)[^\\s\"'',}&]+", "<redacted>")}'
          - msg: '${text.replace_all_regex(msg, "https://hooks\\.slack\\.com/[^\\s\"'']+", "<webhook>")}'
    - cut:
        switch:
          - condition: '${len(msg) > 1500}'
            assign:
              - msg: '${text.substring(msg, 0, 1500) + "…"}'
    - done:
        return: '${msg}'

err_class:
  params: [e]
  steps:
    - pick:
        switch:
          - condition: '${get_type(e) == "map" and "error_class" in e}'
            return: '${e.error_class}'
          # the status before the tags: every HTTP failure is tagged HttpError,
          # and a 404 and a 500 are different failure streaks
          - condition: '${get_type(e) == "map" and get_type(map.get(e, "code")) == "integer"}'
            return: '${"code " + string(e.code)}'
          - condition: '${get_type(e) == "map" and "tags" in e and len(e.tags) > 0}'
            return: '${e.tags[0]}'
    - other:
        return: "error"

stage_error:
  # Raise e as a stage error unless it already is one (an inner stage's
  # error keeps its stage).
  params: [stage, e, attempt: 1, attempts: 1]
  steps:
    - already:
        switch:
          - condition: '${get_type(e) == "map" and "pipeline_stage" in e}'
            raise: '${e}'
    - text:
        call: err_text
        args:
          e: '${e}'
        result: msg
    - cls:
        call: err_class
        args:
          e: '${e}'
        result: cls
    - throw:
        raise:
          pipeline_stage: '${stage}'
          error_class: '${cls}'
          message: '${msg}'
          attempt: '${attempt}'
          attempts: '${attempts}'

# ---- Google APIs (OAuth2 as the workflow's account) --------------------------------

retry_transient:
  # The retry predicate (syntax/retrying, "custom retry policy") for requests
  # that are safe to repeat: reads, deletes, writes with ifGenerationMatch
  # and POSTs idempotent by id. Google's transient errors: 408, 429, 500,
  # 502, 503, 504 and connection / timeout errors
  # (https://docs.cloud.google.com/storage/docs/retry-strategy); Workflows'
  # http.default_retry leaves out 408 and 500.
  params: [e]
  steps:
    - pick:
        switch:
          - condition: '${get_type(e) != "map"}'
            return: false
          - condition: '${default(map.get(e, "code"), 0) in [408, 429, 500, 502, 503, 504]}'
            return: true
    - tags:
        assign:
          - tags: '${default(map.get(e, "tags"), [])}'
    - net:
        switch:
          - condition: '${get_type(tags) == "list" and ("ConnectionError" in tags or "ConnectionFailedError" in tags or "TimeoutError" in tags)}'
            return: true
    - other:
        return: false

api_get:
  # Parameter defaults must be literals on Google (a map default fails to
  # build), so query defaults to null and becomes {} here.
  params: [url, query: null]
  steps:
    - init:
        assign:
          - empty: {}
          - q: '${default(query, empty)}'
    - get:
        try:
          call: http.get
          args:
            url: '${url}'
            query: '${q}'
            auth:
              type: OAuth2
            timeout: 120
          result: r
        retry:
          predicate: ${retry_transient}
          max_retries: 5
          backoff:
            initial_delay: 1
            max_delay: 60
            multiplier: 2
    - done:
        return: '${r.body}'

api_get_or_null:
  # 404 -> null. query: null is {} (api_get).
  params: [url, query: null]
  steps:
    - get:
        try:
          call: api_get
          args:
            url: '${url}'
            query: '${query}'
          result: body
        except:
          as: e
          steps:
            - missing:
                switch:
                  - condition: '${get_type(e) == "map" and default(map.get(e, "code"), 0) == 404}'
                    return: null
            - again:
                raise: '${e}'
    - done:
        return: '${body}'

api_send:
  # POST / PATCH with a JSON body. Retried only where the request cannot have
  # been applied (Workflows' non-idempotent policy: 429, 503).
  # body and query default to null (map defaults fail to build) and become {}.
  params: [method, url, body: null, query: null]
  steps:
    - init:
        assign:
          - empty: {}
          - b: '${default(body, empty)}'
          - q: '${default(query, empty)}'
    - pick:
        switch:
          - condition: '${method == "PATCH"}'
            next: send_patch
          - condition: '${method != "POST"}'
            raise:
              error_class: "bad_method"
              message: '${"api_send: POST or PATCH, not " + method}'
    - send_post:
        try:
          call: http.post
          args:
            url: '${url}'
            body: '${b}'
            query: '${q}'
            headers:
              Content-Type: application/json
            auth:
              type: OAuth2
            timeout: 300
          result: r
        retry: '${http.default_retry_non_idempotent}'
        next: done
    - send_patch:
        try:
          call: http.patch
          args:
            url: '${url}'
            body: '${b}'
            query: '${q}'
            headers:
              Content-Type: application/json
            auth:
              type: OAuth2
            timeout: 300
          result: r
        retry: '${http.default_retry_non_idempotent}'
    - done:
        return: '${r.body}'

# ---- Cloud Storage (JSON objects) -----------------------------------------------------

gcs_read:
  # The object's JSON, or null when it does not exist.
  params: [bucket, name]
  steps:
    - get:
        try:
          call: http.get
          args:
            url: '${"https://storage.googleapis.com/storage/v1/b/" + bucket + "/o/" + text.url_encode(name)}'
            query:
              alt: media
            auth:
              type: OAuth2
            timeout: 120
          result: r
        retry:
          predicate: ${retry_transient}
          max_retries: 5
          backoff:
            initial_delay: 1
            max_delay: 60
            multiplier: 2
        except:
          as: e
          steps:
            - missing:
                switch:
                  - condition: '${get_type(e) == "map" and default(map.get(e, "code"), 0) == 404}'
                    return: null
            - again:
                raise: '${e}'
    - parse:
        switch:
          - condition: '${get_type(r.body) == "bytes" or get_type(r.body) == "string"}'
            return: '${json.decode(r.body)}'
    - done:
        return: '${r.body}'

gcs_read_gen:
  # {data, generation} of a JSON object from ONE media GET, or null when it
  # does not exist. The generation comes from the response's
  # x-goog-generation header, so the content and the generation a later
  # ifGenerationMatch names are the same version (a metadata GET and a media
  # GET apart can see two versions). gcs_meta only when the header is absent.
  params: [bucket, name]
  steps:
    - get:
        try:
          call: http.get
          args:
            url: '${"https://storage.googleapis.com/storage/v1/b/" + bucket + "/o/" + text.url_encode(name)}'
            query:
              alt: media
            auth:
              type: OAuth2
            timeout: 120
          result: r
        retry:
          predicate: ${retry_transient}
          max_retries: 5
          backoff:
            initial_delay: 1
            max_delay: 60
            multiplier: 2
        except:
          as: e
          steps:
            - missing:
                switch:
                  - condition: '${get_type(e) == "map" and default(map.get(e, "code"), 0) == 404}'
                    return: null
            - again:
                raise: '${e}'
    - fields:
        assign:
          - empty: {}
          - data: '${r.body}'
          - hdr: '${default(map.get(r, "headers"), empty)}'
          - generation: '${default(map.get(hdr, "x-goog-generation"), map.get(hdr, "X-Goog-Generation"))}'
          - r: null
    - parse:
        switch:
          - condition: '${get_type(data) == "bytes" or get_type(data) == "string"}'
            assign:
              - data: '${json.decode(data)}'
    - no_header:
        switch:
          - condition: '${generation == null}'
            steps:
              - meta:
                  call: gcs_meta
                  args:
                    bucket: '${bucket}'
                    name: '${name}'
                  result: m
              - gone:
                  switch:
                    - condition: '${m == null}'
                      return: null
              - from_meta:
                  assign:
                    - generation: '${m.generation}'
    - done:
        return:
          data: '${data}'
          generation: '${string(generation)}'

gcs_meta:
  # The object's metadata (generation, updated, size), or null.
  params: [bucket, name]
  steps:
    - get:
        call: api_get_or_null
        args:
          url: '${"https://storage.googleapis.com/storage/v1/b/" + bucket + "/o/" + text.url_encode(name)}'
        result: m
    - done:
        return: '${m}'

gcs_write:
  # Write `data` as JSON. if_generation_match: 0 = only when absent (locks);
  # a generation = only when unchanged since that read. A precondition
  # failure raises the HttpError (code 412). A conditional write is
  # idempotent (a repeat of one that landed gets 412), so it is retried on
  # transient errors; an unconditional one only where it cannot have landed.
  params: [bucket, name, data, if_generation_match: null]
  steps:
    - q:
        assign:
          - query:
              uploadType: media
              name: '${name}'
    - pre:
        switch:
          - condition: '${if_generation_match != null}'
            assign:
              - query.ifGenerationMatch: '${string(if_generation_match)}'
            next: put_cond
    - put:
        try:
          call: http.post
          args:
            url: '${"https://storage.googleapis.com/upload/storage/v1/b/" + bucket + "/o"}'
            query: '${query}'
            headers:
              Content-Type: application/json
            body: '${data}'
            auth:
              type: OAuth2
            timeout: 120
          result: r
        retry: '${http.default_retry_non_idempotent}'
        next: done
    - put_cond:
        try:
          call: http.post
          args:
            url: '${"https://storage.googleapis.com/upload/storage/v1/b/" + bucket + "/o"}'
            query: '${query}'
            headers:
              Content-Type: application/json
            body: '${data}'
            auth:
              type: OAuth2
            timeout: 120
          result: r
        retry:
          predicate: ${retry_transient}
          max_retries: 5
          backoff:
            initial_delay: 1
            max_delay: 60
            multiplier: 2
    - done:
        return: '${r.body}'

gcs_delete:
  # Delete; absent is fine. generation: only that generation.
  params: [bucket, name, generation: null]
  steps:
    - q:
        assign:
          - query: {}
    - pre:
        switch:
          - condition: '${generation != null}'
            assign:
              - query.ifGenerationMatch: '${string(generation)}'
    - del:
        try:
          call: http.delete
          args:
            url: '${"https://storage.googleapis.com/storage/v1/b/" + bucket + "/o/" + text.url_encode(name)}'
            query: '${query}'
            auth:
              type: OAuth2
            timeout: 120
        retry:
          predicate: ${retry_transient}
          max_retries: 5
          backoff:
            initial_delay: 1
            max_delay: 60
            multiplier: 2
        except:
          as: e
          steps:
            - gone:
                switch:
                  - condition: '${get_type(e) == "map" and default(map.get(e, "code"), 0) == 404}'
                    return: false
            - again:
                raise: '${e}'
    - done:
        return: true

gcs_list:
  # Object names under a prefix, in the API's lexicographic order: every
  # page, or the first `max` names (max > 0; a long outbox listed whole
  # would not fit Workflows' 512 KB of variables).
  params: [bucket, prefix, max: 0]
  steps:
    - init:
        assign:
          - names: []
          - token: null
    - page:
        assign:
          - query:
              prefix: '${prefix}'
              fields: "items(name),nextPageToken"
              maxResults: 1000
    - small:
        switch:
          - condition: '${max > 0 and max < 1000}'
            assign:
              - query.maxResults: '${max}'
    - tok:
        switch:
          - condition: '${token != null}'
            assign:
              - query.pageToken: '${token}'
    - get:
        call: api_get
        args:
          url: '${"https://storage.googleapis.com/storage/v1/b/" + bucket + "/o"}'
          query: '${query}'
        result: body
    - collect:
        for:
          value: item
          in: '${default(map.get(body, "items"), [])}'
          steps:
            - full:
                switch:
                  - condition: '${max > 0 and len(names) >= max}'
                    next: break
            - add:
                assign:
                  - names: '${list.concat(names, item.name)}'
    - more:
        switch:
          - condition: '${max > 0 and len(names) >= max}'
            next: done
          - condition: '${"nextPageToken" in body and body.nextPageToken != null and body.nextPageToken != ""}'
            next: next_tok
        next: done
    - next_tok:
        assign:
          - token: '${body.nextPageToken}'
        next: page
    - done:
        return: '${names}'

gcs_delete_prefix:
  params: [bucket, prefix]
  steps:
    - list:
        call: gcs_list
        args:
          bucket: '${bucket}'
          prefix: '${prefix}'
        result: names
    - each:
        for:
          value: obj
          in: '${names}'
          steps:
            - del:
                call: gcs_delete
                args:
                  bucket: '${bucket}'
                  name: '${obj}'
    - done:
        return: '${len(names)}'

# ---- locks (state/locks/<name>.json, DESIGN §2.2) --------------------------------------

lock_acquire:
  # {acquired: bool, holder}. An object insert with ifGenerationMatch=0; a
  # lock past expires_at is broken only when breakable (gpu-eval yes,
  # retrain never: a stale retrain lock is for a person, RETRAIN.md R8).
  params: [bucket, name, run_id, ttl_s, breakable: true]
  steps:
    - init:
        assign:
          - exec_id: '${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}'
          - tries: 0
    - attempt:
        assign:
          - now: '${sys.now()}'
          - tries: '${tries + 1}'
          - body:
              holder: '${exec_id}'
              run_id: '${run_id}'
              expires_at: '${time.format(now + ttl_s)}'
              updated_at: '${time.format(now)}'
    - insert:
        try:
          call: gcs_write
          args:
            bucket: '${bucket}'
            name: '${name}'
            data: '${body}'
            if_generation_match: 0
        except:
          as: e
          steps:
            - other:
                switch:
                  - condition: '${not(get_type(e) == "map" and default(map.get(e, "code"), 0) == 412)}'
                    raise: '${e}'
            - held:
                next: inspect
    - got:
        return:
          acquired: true
          holder: '${body}'
    - inspect:
        # content and generation of one version (gcs_read_gen): what is judged
        # below is exactly what break_it's ifGenerationMatch deletes
        call: gcs_read_gen
        args:
          bucket: '${bucket}'
          name: '${name}'
        result: held
    - vanished:
        switch:
          - condition: '${held == null and tries < 4}'
            next: attempt
    - read:
        assign:
          - cur: null
          - gen: null
    - read_held:
        switch:
          - condition: '${held != null}'
            assign:
              - cur: '${held.data}'
              - gen: '${held.generation}'
    - ours:
        # our own insert, retried after a lost response
        switch:
          - condition: '${cur != null and default(map.get(cur, "holder"), "") == exec_id and default(map.get(cur, "run_id"), "") == run_id}'
            return:
              acquired: true
              holder: '${cur}'
    - expired:
        switch:
          - condition: '${breakable and gen != null and cur != null and "expires_at" in cur and time.parse(cur.expires_at) < sys.now() and tries < 4}'
            next: log_break
        next: busy
    - log_break:
        call: log
        args:
          text: '${"breaking expired lock " + name + " held by " + json.encode_to_string(cur)}'
          severity: WARNING
    - break_it:
        # 412: someone refreshed or replaced the lock since it was read; look again
        try:
          call: gcs_delete
          args:
            bucket: '${bucket}'
            name: '${name}'
            generation: '${gen}'
        except:
          as: e
          steps:
            - raced:
                switch:
                  - condition: '${not(get_type(e) == "map" and default(map.get(e, "code"), 0) == 412)}'
                    raise: '${e}'
        next: attempt
    - busy:
        return:
          acquired: false
          holder: '${cur}'

lock_wait:
  # lock_acquire, retried every 5 min for up to wait_s.
  params: [bucket, name, run_id, ttl_s, wait_s, breakable: true]
  steps:
    - init:
        assign:
          - deadline: '${sys.now() + wait_s}'
    - try_lock:
        call: lock_acquire
        args:
          bucket: '${bucket}'
          name: '${name}'
          run_id: '${run_id}'
          ttl_s: '${ttl_s}'
          breakable: '${breakable}'
        result: got
    - done_or_wait:
        switch:
          - condition: '${got.acquired or sys.now() + 300 > deadline}'
            return: '${got}'
    - sleep:
        call: sys.sleep
        args:
          seconds: 300
        next: try_lock

lock_release:
  # Delete the lock only when this run holds it (the version read: a 412
  # means it changed hands meanwhile, and it is left alone).
  params: [bucket, name, run_id]
  steps:
    - read:
        call: gcs_read_gen
        args:
          bucket: '${bucket}'
          name: '${name}'
        result: held
    - none:
        switch:
          - condition: '${held == null}'
            return: false
    - mine:
        switch:
          - condition: '${get_type(held.data) == "map" and default(map.get(held.data, "run_id"), "") == run_id}'
            steps:
              - del:
                  try:
                    call: gcs_delete
                    args:
                      bucket: '${bucket}'
                      name: '${name}'
                      generation: '${held.generation}'
                  except:
                    as: e
                    steps:
                      - raced:
                          switch:
                            - condition: '${get_type(e) == "map" and default(map.get(e, "code"), 0) == 412}'
                              return: false
                      - again:
                          raise: '${e}'
              - ok:
                  return: true
    - not_mine:
        return: false

lock_refresh:
  # Push expires_at / updated_at forward while this run holds the lock.
  params: [bucket, name, run_id, ttl_s]
  steps:
    - read:
        call: gcs_read_gen
        args:
          bucket: '${bucket}'
          name: '${name}'
        result: held
    - none:
        switch:
          - condition: '${held == null}'
            return: false
    - cur:
        assign:
          - cur: '${held.data}'
    - mine:
        switch:
          - condition: '${get_type(cur) != "map" or default(map.get(cur, "run_id"), "") != run_id}'
            return: false
    - write:
        try:
          call: gcs_write
          args:
            bucket: '${bucket}'
            name: '${name}'
            data:
              holder: '${default(map.get(cur, "holder"), "")}'
              run_id: '${run_id}'
              expires_at: '${time.format(sys.now() + ttl_s)}'
              updated_at: '${time.format(sys.now())}'
            if_generation_match: '${held.generation}'
        except:
          as: e
          steps:
            - lost:
                return: false
    - done:
        return: true

# ---- Cloud Run (v2 REST) ------------------------------------------------------------------

run_resource_wait:
  # Wait until a Cloud Run job or service has settled after a PATCH, by
  # polling the resource itself (jobs.get / services.get: run.developer on
  # the job or service, which souschef-workflow holds). Not GET
  # operations/{id}: an operation sits at location level and needs
  # run.operations.get on the project, which the workflow account does not
  # have (403 OPERATION_GET; the 2026-10-12 audit). Per the v2 reference
  # (services `reconciling`): once reconciling is false, either the serving
  # state matches (observedGeneration = generation, terminalCondition
  # CONDITION_SUCCEEDED) or reconciliation failed (terminalCondition says
  # why). `generation` (int64) arrives as a string. target: the PATCH's own
  # generation (the operation's metadata is the resource as written), at
  # least gen_before + 1. {ok, res, condition}; raises operation_timeout.
  params: [url, op, gen_before, timeout_s: 1800, every_s: 15]
  steps:
    - init:
        assign:
          - empty: {}
          - start: '${sys.now()}'
          - deadline: '${sys.now() + timeout_s}'
          # every PATCH sent here changes the template or forces a revision,
          # so gen_before + 1 is a floor whatever the operation's metadata holds
          - target: '${gen_before + 1}'
          - op_gen: '${int(default(map.get(op, ["metadata", "generation"]), "0"))}'
    - op_target:
        switch:
          - condition: '${op_gen > target}'
            assign:
              - target: '${op_gen}'
    - op_error:
        # an operation that came back done with an error (the PATCH itself failed)
        switch:
          - condition: '${default(map.get(op, "done"), false) == true and map.get(op, "error") != null}'
            raise:
              error_class: "operation_failed"
              message: '${json.encode_to_string(op.error)}'
    - poll:
        call: api_get
        args:
          url: '${url}'
        result: r
    - fields:
        assign:
          - has_gen: '${"generation" in r}'
          - gen: '${int(default(map.get(r, "generation"), "0"))}'
          - obs: '${int(default(map.get(r, "observedGeneration"), "0"))}'
          - rec: '${default(map.get(r, "reconciling"), false) == true}'
          - cond: '${default(map.get(r, "terminalCondition"), empty)}'
          - cstate: '${default(map.get(cond, "state"), "CONDITION_SUCCEEDED")}'
          - applied: '${not(has_gen) or gen >= target}'
    - judge:
        switch:
          - condition: '${not(rec) and applied and (not(has_gen) or obs >= gen) and cstate == "CONDITION_SUCCEEDED"}'
            return:
              ok: true
              res: '${r}'
              condition: '${cond}'
          # failed: observedGeneration may stay at the last serving generation,
          # so a minute's grace covers a read before reconciling turned true
          - condition: '${not(rec) and applied and cstate == "CONDITION_FAILED" and (not(has_gen) or obs >= gen or sys.now() - start > 60)}'
            return:
              ok: false
              res: '${r}'
              condition: '${cond}'
          - condition: '${sys.now() > deadline}'
            raise:
              error_class: "operation_timeout"
              message: '${url + " not settled after " + string(timeout_s) + " s (generation " + string(gen) + ", observed " + string(obs) + ", reconciling " + string(rec) + ", " + cstate + ")"}'
    - sleep:
        call: sys.sleep
        args:
          seconds: '${every_s}'
        next: poll

job_set_image:
  # Re-point a job at `image` unless it already runs it. A 409 (the job
  # changed between the read and the PATCH: a concurrent execution re-pointing
  # it, a person's gcloud) is read again once.
  params: [cfg, job, image]
  steps:
    - init:
        assign:
          - url: '${"https://run.googleapis.com/v2/projects/" + cfg.project + "/locations/" + cfg.jobs_region + "/jobs/" + job}'
          - conflicts: 0
    - get:
        call: api_get
        args:
          url: '${url}'
        result: j
    - same:
        switch:
          - condition: '${j.template.template.containers[0].image == image}'
            return: false
    - set:
        assign:
          - j.template.template.containers[0].image: '${image}'
          - gen_before: '${int(default(map.get(j, "generation"), "0"))}'
    - patch:
        try:
          call: api_send
          args:
            method: PATCH
            url: '${url}'
            body: '${j}'
          result: op
        except:
          as: e
          steps:
            - stale:
                switch:
                  - condition: '${get_type(e) == "map" and default(map.get(e, "code"), 0) == 409 and conflicts < 1}'
                    assign:
                      - conflicts: '${conflicts + 1}'
                    next: get
            - again:
                raise: '${e}'
    - wait:
        call: run_resource_wait
        args:
          url: '${url}'
          op: '${op}'
          gen_before: '${gen_before}'
          timeout_s: 600
          every_s: 10
        result: w
    - judge:
        switch:
          - condition: '${not(w.ok)}'
            raise:
              error_class: "job_update_failed"
              message: '${"job " + job + " did not take " + image + ": " + json.encode_to_string(w.condition)}'
    - done:
        return: true

run_job:
  # Run a job with per-stage args and env; wait for its execution.
  # {ok, execution, exit_code, message, cancelled?, no_retry?}. Never raises
  # (a failed start is a failed attempt the caller may retry). jobs:run has
  # no request id: a start whose answer was lost (5xx, connection, timeout)
  # may have made an execution, so the job's latestCreatedExecution is read
  # before and after it and a new one is taken, never a blind resend.
  # no_retry = a 4xx refusal, or a start whose outcome is unknown;
  # cancelled = someone cancelled the execution. The caller retries neither.
  params: [cfg, job, args, env, timeout_s]
  steps:
    - init:
        assign:
          - url: '${"https://run.googleapis.com/v2/projects/" + cfg.project + "/locations/" + cfg.jobs_region + "/jobs/" + job}'
          - envlist: []
          - started: '${sys.now()}'
          - empty: {}  # no map literals in expressions: [{}] is [empty]
          - tl: {}
          - sends: 0
          - jb: null
          - execution: null
          - now_exec: null
          - scode: 0
          - start_msg: ""
    - mkenv:
        for:
          value: k
          in: '${keys(env)}'
          steps:
            - add:
                assign:
                  # Expressions have no map literals: build the entry as YAML.
                  - entry:
                      name: '${k}'
                      value: '${string(env[k])}'
                  - envlist: '${list.concat(envlist, entry)}'
    - before_run:
        try:
          call: api_get
          args:
            url: '${url}'
          result: jb
        except:
          as: e
          steps:
            - unread_job:
                call: err_text
                args:
                  e: '${e}'
                result: start_msg
            - not_read:
                return:
                  ok: false
                  execution: null
                  exit_code: -1
                  message: '${"job not readable before jobs:run: " + start_msg}'
    - prev_exec:
        assign:
          - prev: '${map.get(jb, ["latestCreatedExecution", "name"])}'
          - jb: null
          - run_body:
              overrides:
                containerOverrides:
                  - args: '${args}'
                    env: '${envlist}'
                taskCount: 1
                timeout: '${string(timeout_s) + "s"}'
    - start:
        try:
          call: http.post
          args:
            url: '${url + ":run"}'
            body: '${run_body}'
            headers:
              Content-Type: application/json
            auth:
              type: OAuth2
            timeout: 300
          result: op
        except:
          as: e
          steps:
            - why_start:
                call: err_text
                args:
                  e: '${e}'
                result: start_msg
            - start_code:
                switch:
                  - condition: '${get_type(e) == "map" and get_type(map.get(e, "code")) == "integer"}'
                    assign:
                      - scode: '${e.code}'
                  - condition: true
                    assign:
                      - scode: 0
            - rejected:
                # a 4xx (but 408 / 429) was refused, not applied
                switch:
                  - condition: '${scode >= 400 and scode < 500 and scode != 408 and scode != 429}'
                    return:
                      ok: false
                      no_retry: true
                      execution: null
                      exit_code: -1
                      message: '${"jobs:run refused: " + start_msg}'
            - nap:
                call: sys.sleep
                args:
                  seconds: '${15 * (sends + 1)}'
            - look:
                try:
                  call: api_get
                  args:
                    url: '${url}'
                  result: jb
                except:
                  as: e2
                  steps:
                    - unknown:
                        return:
                          ok: false
                          no_retry: true
                          execution: null
                          exit_code: -1
                          message: '${"jobs:run answered " + start_msg + "; the job was unreadable after it, so whether an execution started is unknown (gcloud run jobs executions list --job " + job + "); not retried"}'
            - made:
                assign:
                  - now_exec: '${map.get(jb, ["latestCreatedExecution", "name"])}'
                  - jb: null
            - adopt:
                switch:
                  # the reference holds the short name (live job_drift.json)
                  - condition: '${get_type(now_exec) == "string" and now_exec != prev and len(text.split(now_exec, "/")) == 1}'
                    assign:
                      - execution: '${"projects/" + cfg.project + "/locations/" + cfg.jobs_region + "/jobs/" + job + "/executions/" + now_exec}'
                    next: announce
                  - condition: '${get_type(now_exec) == "string" and now_exec != prev}'
                    assign:
                      - execution: '${now_exec}'
                    next: announce
            - resend:
                switch:
                  - condition: '${sends < 3}'
                    assign:
                      - sends: '${sends + 1}'
                    next: start
            - not_started:
                return:
                  ok: false
                  execution: null
                  exit_code: -1
                  message: '${"jobs:run failed: " + start_msg}'
    - exec_name:
        assign:
          - execution: '${op.body.metadata.name}'
          - op: null
    - announce:
        assign:
          - deadline: '${started + timeout_s + 3600}'
    - announce_log:
        call: log
        args:
          text: '${"started " + execution + " args " + json.encode_to_string(args)}'
    - interval:
        # 20 s for the first 5 min, 2 min to the first hour, then 5 min: a
        # 24 h collect polled every 2 min would spend ~6k of the execution's
        # 100k steps per attempt
        assign:
          - pause: 300
    - short:
        switch:
          - condition: '${sys.now() - started < 300}'
            assign:
              - pause: 20
          - condition: '${sys.now() - started < 3600}'
            assign:
              - pause: 120
    - wait:
        call: sys.sleep
        args:
          seconds: '${pause}'
    - poll:
        call: api_get
        args:
          url: '${"https://run.googleapis.com/v2/" + execution}'
        result: ex
    - running:
        switch:
          - condition: '${map.get(ex, "completionTime") == null and sys.now() > deadline}'
            next: cancel
          - condition: '${map.get(ex, "completionTime") == null}'
            next: interval
    - counts:
        # completionTime is "not guaranteed to be set in happens-before order"
        # with the counts (executions reference): finished = completed AND
        # counted (or a Completed condition that has ended)
        assign:
          - succ: '${int(default(map.get(ex, "succeededCount"), 0))}'
          - fail_n: '${int(default(map.get(ex, "failedCount"), 0))}'
          - canc: '${int(default(map.get(ex, "cancelledCount"), 0))}'
          - cond: '${default(map.get(ex, "conditions"), [])}'
          - completed: ""
    - completed_cond:
        for:
          value: c
          in: '${cond}'
          steps:
            - is_completed:
                switch:
                  - condition: '${get_type(c) == "map" and map.get(c, "type") == "Completed"}'
                    assign:
                      - completed: '${default(map.get(c, "state"), "")}'
    - finished:
        switch:
          - condition: '${succ + fail_n + canc >= 1 or completed == "CONDITION_SUCCEEDED" or completed == "CONDITION_FAILED"}'
            next: outcome
          - condition: '${sys.now() > deadline}'
            next: cancel
        next: interval
    - cancel:
        try:
          call: api_send
          args:
            method: POST
            url: '${"https://run.googleapis.com/v2/" + execution + ":cancel"}'
        except:
          as: e
          steps:
            - ignore:
                assign:
                  - cancel_error: '${e}'
    - late:
        return:
          ok: false
          execution: '${execution}'
          exit_code: -1
          message: '${"no completion after " + string(timeout_s + 3600) + " s; cancelled"}'
    - outcome:
        switch:
          - condition: '${succ >= 1 or (completed == "CONDITION_SUCCEEDED" and fail_n == 0 and canc == 0)}'
            return:
              ok: true
              execution: '${execution}'
              exit_code: 0
              message: ""
          - condition: '${canc >= 1}'
            return:
              ok: false
              cancelled: true
              execution: '${execution}'
              exit_code: -1
              message: '${"execution cancelled (by a person or the platform), not retried: " + json.encode_to_string(cond)}'
    - tasks:
        try:
          call: api_get
          args:
            url: '${"https://run.googleapis.com/v2/" + execution + "/tasks"}'
          result: tl
        except:
          as: e
          steps:
            - no_tasks:
                assign:
                  - tl: {}
    - code:
        assign:
          - t0: '${default(map.get(tl, "tasks"), [empty])[0]}'
          - exit_code: '${default(map.get(t0, ["lastAttemptResult", "exitCode"]), -1)}'
          - msg: '${default(map.get(t0, ["lastAttemptResult", "status", "message"]), "")}'
    - failed:
        return:
          ok: false
          execution: '${execution}'
          exit_code: '${exit_code}'
          message: '${msg + " " + json.encode_to_string(cond)}'

service_get:
  params: [cfg, svc]
  steps:
    - get:
        call: api_get
        args:
          url: '${"https://run.googleapis.com/v2/projects/" + cfg.project + "/locations/" + svc.region + "/services/" + svc.name}'
        result: s
    - done:
        return: '${s}'

service_ready_image:
  # The image the service SERVES and that revision: the trafficStatuses
  # entry with the largest percent (a LATEST entry names the revision it
  # resolved to), not latestReadyRevision, which is a `--no-traffic` preview
  # deploy's revision while it waits at 0 %
  # (https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration);
  # latestReadyRevision only when no entry carries a percent.
  params: [cfg, svc]
  steps:
    - get:
        call: service_get
        args:
          cfg: '${cfg}'
          svc: '${svc}'
        result: s
    - pick:
        assign:
          - rev: '${s.latestReadyRevision}'
          - best: 0
    - serving:
        for:
          value: ts
          in: '${default(map.get(s, "trafficStatuses"), [])}'
          steps:
            - better:
                switch:
                  - condition: '${get_type(map.get(ts, "revision")) == "string" and map.get(ts, "revision") != "" and default(map.get(ts, "percent"), 0) > best}'
                    assign:
                      - best: '${ts.percent}'
                      - rev: '${s.name + "/revisions/" + ts.revision}'
    - rev:
        call: api_get
        args:
          url: '${"https://run.googleapis.com/v2/" + rev}'
        result: r
    - done:
        return:
          image: '${r.containers[0].image}'
          revision: '${rev}'
          percent: '${best}'
          latest_ready: '${s.latestReadyRevision}'
          created: '${r.createTime}'
          service: '${s}'

traffic_latest:
  # true when a service sends all traffic to its latest ready revision: no
  # traffic entries (the documented default), or a LATEST target at 100 %
  # and no REVISION target with a percent (0 % tagged previews are fine).
  params: [s]
  steps:
    - init:
        assign:
          - latest: 0
          - pinned: 0
          - t: '${default(map.get(s, "traffic"), [])}'
    - none:
        switch:
          - condition: '${len(t) == 0}'
            return: true
    - each:
        for:
          value: x
          in: '${t}'
          steps:
            - add:
                switch:
                  - condition: '${map.get(x, "type") == "TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST"}'
                    assign:
                      - latest: '${latest + default(map.get(x, "percent"), 0)}'
                  - condition: true
                    assign:
                      - pinned: '${pinned + default(map.get(x, "percent"), 0)}'
    - done:
        return: '${latest == 100 and pinned == 0}'

service_set_image:
  # Patch a GPU service's image (+ the souschef/candidate annotation) and
  # wait until the new revision is the ready one. Nothing else in the
  # service changes: the body is the service as read, with two fields set
  # (and a stale template.revision name dropped: re-sending one asks for a
  # revision that already exists). When the last revision failed (ready !=
  # created), the PATCH forces a new revision: an identical template creates
  # none (services.patch forceNewRevision). {changed, revision}
  params: [cfg, svc, image, note]
  steps:
    - get:
        call: service_get
        args:
          cfg: '${cfg}'
          svc: '${svc}'
        result: s
    - same:
        switch:
          - condition: '${s.template.containers[0].image == image and s.latestReadyRevision == s.latestCreatedRevision}'
            return:
              changed: false
              revision: '${s.latestReadyRevision}'
    - set:
        assign:
          - url: '${"https://run.googleapis.com/v2/projects/" + cfg.project + "/locations/" + svc.region + "/services/" + svc.name}'
          - q: {}
          - gen_before: '${int(default(map.get(s, "generation"), "0"))}'
          - s.template.containers[0].image: '${image}'
    - force:
        switch:
          - condition: '${s.latestReadyRevision != s.latestCreatedRevision}'
            assign:
              - q.forceNewRevision: "true"
    - no_rev_name:
        switch:
          - condition: '${"revision" in s.template}'
            assign:
              - s.template: '${map.delete(s.template, "revision")}'
    - ann:
        switch:
          - condition: '${not("annotations" in s.template) or s.template.annotations == null}'
            assign:
              - s.template.annotations: {}
    - ann_set:
        assign:
          - s.template.annotations["souschef/candidate"]: '${note}'
    - patch:
        call: api_send
        args:
          method: PATCH
          url: '${url}'
          body: '${s}'
          query: '${q}'
        result: op
    - wait:
        call: run_resource_wait
        args:
          url: '${url}'
          op: '${op}'
          gen_before: '${gen_before}'
          timeout_s: 2700
          every_s: 20
        result: w
    - ready:
        switch:
          - condition: '${not(w.ok) or map.get(w.res, "latestReadyRevision") != map.get(w.res, "latestCreatedRevision")}'
            raise:
              error_class: "revision_not_ready"
              message: '${svc.name + ": revision " + default(map.get(w.res, "latestCreatedRevision"), "?") + " did not become ready; " + default(map.get(w.res, "latestReadyRevision"), "none") + " is the latest ready one. " + json.encode_to_string(w.condition)}'
    - done:
        return:
          changed: true
          revision: '${w.res.latestReadyRevision}'

warm:
  # Load the model on a GPU service (an empty /api/generate with keep_alive
  # -1), retried until minutes pass. true = it answered.
  params: [cfg, url, minutes]
  steps:
    - init:
        assign:
          - deadline: '${sys.now() + minutes * 60}'
    - load:
        try:
          call: http.post
          args:
            url: '${url + "/api/generate"}'
            body:
              model: '${cfg.ollama_model}'
              prompt: ""
              keep_alive: -1
              stream: false
            auth:
              type: OIDC
              audience: '${url}'
            timeout: 900
          result: r
        except:
          as: e
          steps:
            - give_up:
                switch:
                  - condition: '${sys.now() + 30 > deadline}'
                    steps:
                      - why:
                          call: err_text
                          args:
                            e: '${e}'
                          result: msg
                      - note:
                          call: log
                          args:
                            text: '${"warm " + url + " gave up: " + msg}'
                            severity: WARNING
                      - gave_up:
                          return: false
            - pause:
                call: sys.sleep
                args:
                  seconds: 30
                next: load
    - ok:
        return: true

# ---- Artifact Registry -----------------------------------------------------------------------

ar_digest_tags:
  # The tags of <repository>/<package>@<digest> ("sha256:…"), as Artifact
  # Registry lists them (versions/<digest>?view=FULL relatedTags), without
  # "latest"; [] when the digest is not in the repository.
  params: [cfg, location, repository, package, digest]
  steps:
    - get:
        call: api_get_or_null
        args:
          url: '${"https://artifactregistry.googleapis.com/v1/projects/" + cfg.project + "/locations/" + location + "/repositories/" + repository + "/packages/" + text.url_encode(package) + "/versions/" + digest}'
          query:
            view: FULL
        result: v
    - none:
        switch:
          - condition: '${v == null}'
            return: []
    - init:
        assign:
          - out: []
          - related: '${default(map.get(v, "relatedTags"), [])}'
    - each:
        for:
          value: rt
          in: '${related}'
          steps:
            - name:
                assign:
                  - rparts: '${text.split(rt.name, "/")}'
                  - rname: '${rparts[len(rparts) - 1]}'
            - keep:
                switch:
                  - condition: '${rname != "latest"}'
                    steps:
                      - add:
                          assign:
                            - out: '${list.concat(out, rname)}'
    - done:
        return: '${out}'

ar_tag_digest:
  # sha256:... of <repository>/<package>:<tag>, or null when the tag is absent.
  params: [cfg, location, repository, package, tag]
  steps:
    - get:
        call: api_get_or_null
        args:
          url: '${"https://artifactregistry.googleapis.com/v1/projects/" + cfg.project + "/locations/" + location + "/repositories/" + repository + "/packages/" + text.url_encode(package) + "/tags/" + text.url_encode(tag)}'
        result: t
    - none:
        switch:
          - condition: '${t == null}'
            return: null
    - digest:
        assign:
          - parts: '${text.split(t.version, "/")}'
    - done:
        return: '${parts[len(parts) - 1]}'

image_digest:
  # sha256:... for an image reference (by digest already, or by tag in the
  # model repository).
  params: [cfg, image]
  steps:
    - by_digest:
        switch:
          - condition: '${len(text.find_all(image, "@sha256:")) > 0}'
            return: '${text.split(image, "@")[1]}'
    - tag:
        assign:
          - parts: '${text.split(image, ":")}'
          - tag: '${parts[len(parts) - 1]}'
    - lookup:
        call: ar_tag_digest
        args:
          cfg: '${cfg}'
          location: '${cfg.model_repo.location}'
          repository: '${cfg.model_repo.repository}'
          package: "model"
          tag: '${tag}'
        result: d
    - missing:
        switch:
          - condition: '${d == null}'
            raise:
              error_class: "image_missing"
              message: '${"no tag " + tag + " in the model repository for " + image}'
    - done:
        return: '${d}'

prod_model:
  # What merchants are served: the production model service's ready image,
  # its digest and the digest reference the eval service is pointed at.
  params: [cfg]
  steps:
    - ready:
        call: service_ready_image
        args:
          cfg: '${cfg}'
          svc: '${cfg.prod_model}'
        result: r
    - digest:
        call: image_digest
        args:
          cfg: '${cfg}'
          image: '${r.image}'
        result: d
    - done:
        return:
          image: '${r.image}'
          digest: '${d}'
          digest_image: '${cfg.model_repo.image + "@" + d}'
          revision: '${r.revision}'

resolve_images:
  # DESIGN §6.3: the int service's serving tag T -> sous-chef-lab:T and
  # sous-chef-trainer:T (CI pushes both beside sous-chef:T; a manual service
  # build needs `make lab-image trainer-image TAG=T`). A Cloud Run revision
  # records its image by digest (<repo>/sous-chef@sha256:…, 2026-10-13: the
  # first real poll failed on it), so T then comes from Artifact Registry:
  # the digest's tags (versions/<digest>?view=FULL relatedTags, absent on an
  # untagged version; `latest` skipped), the first one with BOTH a lab and a
  # trainer image, else the first with a lab image, else the first. The
  # serving revision is the one trafficStatuses names (service_ready_image).
  # lab_digest / trainer_digest are recorded beside the tags (run.json).
  params: [cfg]
  steps:
    - ready:
        call: service_ready_image
        args:
          cfg: '${cfg}'
          svc: '${cfg.int_service}'
        result: r
    - form:
        switch:
          - condition: '${len(text.find_all(r.image, "@")) > 0}'
            next: by_digest
    - tag:
        assign:
          - parts: '${text.split(r.image, ":")}'
          - tag: '${parts[len(parts) - 1]}'
    - bad_ref:
        switch:
          - condition: '${len(parts) < 2 or len(text.find_all(tag, "/")) > 0}'
            raise:
              pipeline_stage: "images"
              error_class: "untagged_service_image"
              message: '${"the int service runs " + r.image + ", not <repo>/sous-chef:<tag>: the lab image cannot be resolved"}'
              attempt: 1
              attempts: 1
        next: lab
    - by_digest:
        assign:
          - at: '${text.split(r.image, "@")}'
          - path: '${text.split(at[0], "/")}'
          - tag: null
    - digest_tags:
        call: ar_digest_tags
        args:
          cfg: '${cfg}'
          location: '${text.split(path[0], "-docker.pkg.dev")[0]}'
          repository: '${path[len(path) - 2]}'
          package: '${path[len(path) - 1]}'
          digest: '${at[1]}'
        result: tags
    - no_tags:
        switch:
          - condition: '${len(tags) == 0}'
            raise:
              pipeline_stage: "images"
              error_class: "untagged_service_image"
              message: '${"the int service runs " + r.image + ", a digest with no tag in Artifact Registry: the lab image cannot be resolved"}'
              attempt: 1
              attempts: 1
    - first_tag:
        assign:
          - tag: '${tags[0]}'
          - with_lab: null
          - both: false
    - pick:
        for:
          value: t
          in: '${tags}'
          steps:
            - has_lab:
                call: ar_tag_digest
                args:
                  cfg: '${cfg}'
                  location: '${cfg.lab_repo.location}'
                  repository: '${cfg.lab_repo.repository}'
                  package: "sous-chef-lab"
                  tag: '${t}'
                result: t_lab
            - take:
                switch:
                  - condition: '${t_lab != null}'
                    steps:
                      - first_lab:
                          switch:
                            - condition: '${with_lab == null}'
                              assign:
                                - with_lab: '${t}'
                      - has_trainer:
                          call: ar_tag_digest
                          args:
                            cfg: '${cfg}'
                            location: '${cfg.lab_repo.location}'
                            repository: '${cfg.lab_repo.repository}'
                            package: "sous-chef-trainer"
                            tag: '${t}'
                          result: t_tr
                      - pair:
                          switch:
                            - condition: '${t_tr != null}'
                              steps:
                                - keep:
                                    assign:
                                      - tag: '${t}'
                                      - both: true
                                - stop:
                                    next: break
    - lab_only:
        switch:
          - condition: '${not(both) and with_lab != null}'
            assign:
              - tag: '${with_lab}'
    - lab:
        call: ar_tag_digest
        args:
          cfg: '${cfg}'
          location: '${cfg.lab_repo.location}'
          repository: '${cfg.lab_repo.repository}'
          package: "sous-chef-lab"
          tag: '${tag}'
        result: lab_d
    - trainer:
        call: ar_tag_digest
        args:
          cfg: '${cfg}'
          location: '${cfg.lab_repo.location}'
          repository: '${cfg.lab_repo.repository}'
          package: "sous-chef-trainer"
          tag: '${tag}'
        result: trainer_d
    - refs:
        # by digest once resolved: a CI re-push of the (mutable) tag mid-round
        # cannot change what a later stage runs
        assign:
          - lab_ref: '${cfg.lab_repo.image + ":" + tag}'
          - trainer_ref: '${cfg.lab_repo.trainer + ":" + tag}'
    - lab_pin:
        switch:
          - condition: '${lab_d != null}'
            assign:
              - lab_ref: '${cfg.lab_repo.image + "@" + lab_d}'
    - trainer_pin:
        switch:
          - condition: '${trainer_d != null}'
            assign:
              - trainer_ref: '${cfg.lab_repo.trainer + "@" + trainer_d}'
    - done:
        return:
          tag: '${tag}'
          service_image: '${r.image}'
          service_revision: '${r.revision}'
          rolled_at: '${r.created}'
          lab: '${lab_ref}'
          lab_ok: '${lab_d != null}'
          lab_digest: '${lab_d}'
          trainer: '${trainer_ref}'
          trainer_ok: '${trainer_d != null}'
          trainer_digest: '${trainer_d}'

# ---- the thermometer (notifications, decisions; DESIGN §4) ---------------------------------

therm_key:
  params: [cfg]
  steps:
    - read:
        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
        args:
          project_id: '${cfg.project}'
          secret_id: '${cfg.thermometer_secret}'
          version: latest
        result: k
    - done:
        # a secret added with `echo` ends in a newline the thermometer would
        # hash with the key (every message parked, every decision read 401)
        return: '${text.replace_all_regex(k, "\\s", "")}'

notify:
  # POST one notification (idempotent by its id). Never raises: a
  # notification that cannot be delivered is logged ("not delivered": the
  # log-based alert of monitoring.tf) and parked in the bucket's outbox
  # (wf/outbox/: only this account writes wf/, so a job account cannot plant
  # a message the next flush would post with the pipeline key), which every
  # drift poll flushes — a thermometer outage or a key/config mistake (401,
  # 403, 404) delays a message, never drops it. {ok, code?, body?, queued?}
  params: [cfg, payload]
  steps:
    - fill:
        switch:
          - condition: '${not("created_at" in payload)}'
            assign:
              - payload.created_at: '${time.format(sys.now())}'
    - send:
        call: notify_send
        args:
          cfg: '${cfg}'
          payload: '${payload}'
        result: sent
    - delivered:
        switch:
          - condition: '${sent.ok}'
            return: '${sent}'
          # refused for good (400, 409, 413, 422: the message itself is wrong): re-sending cannot help; the log line is the trace
          - condition: '${default(map.get(sent, "permanent"), false)}'
            return: '${sent}'
    - park:
        try:
          call: gcs_write
          args:
            bucket: '${cfg.bucket}'
            name: '${"wf/outbox/" + text.replace_all(payload.id, "/", "~") + ".json"}'
            data: '${payload}'
        except:
          as: e
          steps:
            - lost:
                call: log
                args:
                  text: '${"notification " + payload.id + " (" + payload.kind + ") not delivered and not parked in the outbox"}'
                  severity: ERROR
            - lost_out:
                return:
                  ok: false
                  queued: false
                  error: '${sent.error}'
    - parked:
        return:
          ok: false
          queued: true
          error: '${sent.error}'

flush_outbox:
  # Re-send what notify parked (up to `limit`, in name order: the listing
  # is lexicographic, not by age); a delivered one
  # leaves the outbox. Only a file whose name is its own payload's id is
  # re-sent (notify's naming); anything else is deleted unsent. Never raises.
  # Returns the count delivered.
  params: [cfg, limit: 50]
  steps:
    - init:
        assign:
          - delivered: 0
          - names: []
          - stop: false
    - list:
        try:
          call: gcs_list
          args:
            bucket: '${cfg.bucket}'
            prefix: "wf/outbox/"
            max: '${limit}'
          result: names
        except:
          as: e
          steps:
            - none:
                return: 0
    - each:
        for:
          value: name
          index: i
          in: '${names}'
          steps:
            - enough:
                switch:
                  - condition: '${stop or i >= limit}'
                    next: continue
            - one:
                try:
                  steps:
                    - read:
                        call: gcs_read
                        args:
                          bucket: '${cfg.bucket}'
                          name: '${name}'
                        result: payload
                    - named:
                        assign:
                          - own: false
                    - named_map:
                        switch:
                          - condition: '${get_type(payload) == "map"}'
                            steps:
                              - named_id:
                                  switch:
                                    - condition: '${get_type(map.get(payload, "id")) == "string"}'
                                      assign:
                                        - own: '${name == "wf/outbox/" + text.replace_all(payload.id, "/", "~") + ".json"}'
                    - foreign_check:
                        # a file notify did not write (its name is not its id): never posted
                        switch:
                          - condition: '${payload != null and not(own)}'
                            steps:
                              - foreign:
                                  call: log
                                  args:
                                    text: '${"outbox: " + name + " is not a parked notification (its name is not its id); deleted unsent"}'
                                    severity: WARNING
                              - drop_foreign:
                                  call: gcs_delete
                                  args:
                                    bucket: '${cfg.bucket}'
                                    name: '${name}'
                              - unread:
                                  assign:
                                    - payload: null
                    - resend:
                        switch:
                          - condition: '${payload != null}'
                            steps:
                              - post:
                                  call: notify_send
                                  args:
                                    cfg: '${cfg}'
                                    payload: '${payload}'
                                  result: sent
                              - judge:
                                  switch:
                                    # delivered, or refused for good (400/409/413/422: re-sending cannot help) — out of the outbox
                                    - condition: '${sent.ok or default(map.get(sent, "permanent"), false)}'
                                      steps:
                                        - drop:
                                            call: gcs_delete
                                            args:
                                              bucket: '${cfg.bucket}'
                                              name: '${name}'
                                        - count:
                                            assign:
                                              - delivered: '${delivered + 1}'
                                    # the thermometer is still down: try again at the next poll
                                    - condition: true
                                      assign:
                                        - stop: true
                except:
                  as: e
                  steps:
                    - skip_one:
                        assign:
                          - e: null
    - done:
        return: '${delivered}'

notify_send:
  # One POST to the thermometer. Never raises. {ok, code?, error?}
  params: [cfg, payload]
  steps:
    - post:
        try:
          steps:
            - key:
                call: therm_key
                args:
                  cfg: '${cfg}'
                result: key
            - send:
                try:
                  call: http.post
                  args:
                    url: '${cfg.thermometer_url + "/api/ingest/souschef/notifications"}'
                    headers:
                      X-API-Key: '${key}'
                      Content-Type: application/json
                    body: '${payload}'
                    timeout: 60
                  result: r
                # idempotent by the payload id: a repeat of one that landed answers 200 duplicate
                retry:
                  predicate: ${retry_transient}
                  max_retries: 5
                  backoff:
                    initial_delay: 1
                    max_delay: 60
                    multiplier: 2
        except:
          as: e
          steps:
            - why:
                call: err_text
                args:
                  e: '${e}'
                result: msg
            - code:
                assign:
                  - code: 0
                  - permanent: false
            - code_of:
                switch:
                  - condition: '${get_type(e) == "map"}'
                    assign:
                      - code: '${default(map.get(e, "code"), 0)}'
            - refused:
                switch:
                  # only a refusal of the message itself; 401/403/404 (a key,
                  # SOUSCHEF_INGEST_KEY_IDS or the pipeline switch) are parked
                  # until the configuration is fixed
                  - condition: '${get_type(code) == "integer" and (code == 400 or code == 409 or code == 413 or code == 422)}'
                    assign:
                      - permanent: true
            - note:
                call: log
                args:
                  text: '${"notification " + payload.id + " (" + payload.kind + ") not delivered: " + msg}'
                  severity: ERROR
            - failed:
                return:
                  ok: false
                  permanent: '${permanent}'
                  code: '${code}'
                  error: '${msg}'
    - done:
        return:
          ok: true
          code: '${r.code}'
          body: '${default(map.get(r, "body"), null)}'

notify_result:
  # Post every notification a job put in its result (notifications[], else
  # notification) with the workflow's ids, <prefix>/<kind>/<i>. Kinds in
  # skip (null = ["heartbeat"]) are not posted: heartbeat (the drift workflow posts its own, once a
  # day) and, for the eval stage, candidate_ready (the decide stage sends it
  # with the decision). The result's deployed / model / verdict go into each
  # message's details for the thermometer's state tiles. Returns the count
  # posted. Memory (Workflows holds every variable of every live frame in
  # 512 KB): the messages are taken one at a time by index (no second copy
  # of the list), and details over 32 KB are replaced by a stub before the
  # message is copied into notify / notify_send.
  params: [cfg, res, run_id, candidate_id: null, id_prefix: null, skip: null]
  steps:
    - none:
        switch:
          - condition: '${res == null}'
            return: 0
    - pick:
        assign:
          - nmsg: '${len(default(map.get(res, "notifications"), []))}'
          - listed: true
          - posted: 0
          - tiles: {}
          - skip_kinds: '${default(skip, ["heartbeat"])}'
    - single:
        switch:
          - condition: '${nmsg == 0 and map.get(res, "notification") != null}'
            assign:
              - nmsg: 1
              - listed: false
    - nothing:
        switch:
          - condition: '${nmsg == 0}'
            return: 0
    - tile_deployed:
        switch:
          - condition: '${get_type(map.get(res, "deployed")) == "map"}'
            assign:
              - tiles.deployed:
                  hash: '${map.get(res.deployed, "hash")}'
                  launcher_build: '${map.get(res.deployed, "launcher_build")}'
    - tile_model:
        switch:
          - condition: '${get_type(map.get(res, "model")) == "map"}'
            assign:
              - tiles.model:
                  tag: '${map.get(res.model, "tag")}'
                  digest: '${map.get(res.model, "digest")}'
                  training_manifest: '${map.get(res.model, "training_manifest")}'
    - tile_verdict:
        switch:
          - condition: '${map.get(res, "verdict") != null}'
            assign:
              - tiles.verdict: '${res.verdict}'
    - each:
        for:
          value: i
          range: '${[0, nmsg - 1]}'
          steps:
            - take:
                assign:
                  - msg: null
                  - dsize: 0
            - take_one:
                switch:
                  - condition: '${listed}'
                    assign:
                      - msg: '${res.notifications[i]}'
                  - condition: true
                    assign:
                      - msg: '${res.notification}'
            - skipped:
                switch:
                  - condition: '${get_type(msg) != "map" or default(map.get(msg, "kind"), "") in skip_kinds}'
                    next: continue
            - build:
                assign:
                  - msg.id: '${default(id_prefix, run_id) + "/" + msg.kind + "/" + string(i)}'
                  - msg.run_id: '${run_id}'
                  - msg.candidate_id: '${candidate_id}'
            - sev:
                switch:
                  - condition: '${not("severity" in msg) or msg.severity == null}'
                    assign:
                      - msg.severity: info
            - det:
                switch:
                  - condition: '${get_type(map.get(msg, "details")) != "map"}'
                    assign:
                      - msg.details: {}
            - size:
                try:
                  steps:
                    - measure:
                        assign:
                          - dsize: '${len(json.encode_to_string(msg.details))}'
                except:
                  as: e
                  steps:
                    - unmeasurable:
                        assign:
                          - dsize: 1000000000
            - cap:
                switch:
                  - condition: '${dsize > 32000}'
                    assign:
                      - msg.details:
                          truncated: true
                          bytes: '${dsize}'
                          note: "details too large for a notification (the workflow's memory); see the run's report"
            - with_tiles:
                assign:
                  - msg.details: '${map.merge(tiles, msg.details)}'
            - send:
                call: notify
                args:
                  cfg: '${cfg}'
                  payload: '${msg}'
                result: sent
            - count:
                switch:
                  - condition: '${sent.ok}'
                    assign:
                      - posted: '${posted + 1}'
    - done:
        return: '${posted}'

notify_failure:
  # stage_failed (the thermometer @-mentions the approver). Dedup on
  # <run>:<stage> (or `dedup`) for 6 h on the thermometer's side; the drift
  # workflow passes drift:<stage>:<class> and does its own suppression
  # (drift_failed: consecutive failures, once a day).
  params: [cfg, run_id, wf, e, candidate_id: null, dedup: null, id_suffix: null]
  steps:
    - shape:
        assign:
          - exec_id: '${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}'
          - stage: "workflow"
          - attempt: 1
          - attempts: 1
          - extra: {}
    - from_map:
        switch:
          - condition: '${get_type(e) == "map" and "pipeline_stage" in e}'
            assign:
              - stage: '${e.pipeline_stage}'
              - attempt: '${default(map.get(e, "attempt"), 1)}'
              - attempts: '${default(map.get(e, "attempts"), 1)}'
              - extra:
                  execution: '${default(map.get(e, "execution"), null)}'
                  exit_code: '${default(map.get(e, "exit_code"), null)}'
    - text:
        call: err_text
        args:
          e: '${e}'
        result: msg
    - cls:
        call: err_class
        args:
          e: '${e}'
        result: cls
    - urls:
        assign:
          - console: '${"https://console.cloud.google.com/workflows/workflow/" + cfg.workflows_region + "/" + wf + "/execution/" + exec_id + "?project=" + cfg.project}'
    - book:
        call: playbook_anchor
        args:
          wf: '${wf}'
          stage: '${stage}'
        result: playbook
    - post:
        call: notify
        args:
          cfg: '${cfg}'
          payload:
            id: '${run_id + "/stage_failed/" + text.replace_all(stage, " ", "-") + "/" + default(id_suffix, text.substring(exec_id, 0, 8))}'
            kind: stage_failed
            severity: error
            run_id: '${run_id}'
            candidate_id: '${candidate_id}'
            title: '${"Sous Chef pipeline failed: " + stage + " (" + run_id + ", attempt " + string(attempt) + "/" + string(attempts) + ")"}'
            summary: '${msg + "\nArtifacts kept. Playbook: " + playbook}'
            dedup_key: '${default(dedup, run_id + ":" + stage)}'
            details:
              stage: '${stage}'
              attempt: '${attempt}'
              attempts: '${attempts}'
              error_class: '${cls}'
              workflow: '${wf}'
              execution: '${exec_id}'
              console_url: '${console}'
              playbook: '${playbook}'
              job: '${extra}'
        result: sent
    - done:
        return: '${sent}'

playbook_anchor:
  params: [wf, stage]
  steps:
    - pick:
        switch:
          - condition: '${wf == "souschef-drift"}'
            return: "docs/DRIFT.md"
          - condition: '${stage == "prepare"}'
            return: "docs/RETRAIN.md#r1-prepare"
          - condition: '${stage == "collect"}'
            return: "docs/RETRAIN.md#r2-collection"
          - condition: '${stage == "dataset"}'
            return: "docs/RETRAIN.md#r3-dataset-and-the-parity-gate"
          - condition: '${stage == "train"}'
            return: "docs/RETRAIN.md#r4-training"
          - condition: '${stage == "build"}'
            return: "docs/RETRAIN.md#r5-export-stage-image-build"
          - condition: '${stage == "candidate" or stage == "eval"}'
            return: "docs/RETRAIN.md#r6-candidate-service-and-the-paired-eval"
          - condition: '${stage == "decide" or stage == "rollout" or stage == "skip"}'
            return: "docs/RETRAIN.md#r7-decide-rollout-rollback-skip"
    - other:
        return: "docs/RETRAIN.md#r8-debugging-a-failed-execution"
