# Manual build of the lab runtime image for a service tag (CI builds it in
# the root cloudbuild.yaml for every int deploy). Submit from the repository
# root, in the project CI builds in (its account writes the sous-chef
# repository):
#
#   make lab-image TAG=<service tag>
#   # = gcloud builds submit --project prod-devops-core-project \
#   #     --config images/lab-runtime/cloudbuild.yaml --substitutions=_TAG=<tag> .
#
# The source must be the commit the service tag was built from, so the lab
# renders the prompt that service serves.
substitutions:
  _TAG: ""
  _PROJECT_ID: breadstack-sous-chef-int
  _REGION: northamerica-northeast2
  _AR_REPO: sous-chef

steps:
  # docker:29 (Docker 29.8 CLI with buildx), pinned by its index digest, on a
  # 2026.09 worker (Engine 29): the root cloudbuild.yaml's header says why.
  - name: gcr.io/cloud-builders/docker@sha256:6c9d05f41f8e721e05f7d3d1b5c29904ac2595d1b67de093f59420b6e8146ecf
    id: lab-image
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        [ -n "$_TAG" ] || { echo "_TAG (the service tag) is required"; exit 2; }
        IMAGE="$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/sous-chef-lab:$_TAG"
        docker build --platform linux/amd64 --provenance=false --sbom=false -f images/lab-runtime/Dockerfile --build-arg BUILD_ID="$_TAG" -t "$$IMAGE" .
        docker run --rm --entrypoint /opt/lab/.venv/bin/python "$$IMAGE" -c 'import souschef_lab; print("ok")'
        docker push "$$IMAGE"

timeout: 2400s
options:
  workerRelease: "2026.09" # Docker Engine 29
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
