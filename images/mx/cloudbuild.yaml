# The Mistral arm's exam/eval image, sous-chef-mx:m-<hash12> (images/mx/Dockerfile, docs/MISTRAL.md §3.4). Manual
# only — no trigger runs this file. Submit from the repository root of the mistral-arm worktree, in the project CI
# builds in (its account writes the sous-chef repository):
#
#   gcloud builds submit --project prod-devops-core-project --config images/mx/cloudbuild.yaml \
#     --ignore-file=images/images.gcloudignore --substitutions=_TAG=$(bash images/mx/tag.sh) .
#
# The tag is images/mx/tag.sh's content hash of the uploaded tree (the lab the image copies + images/mx), computed
# again here: a _TAG that differs from it is refused (the local tree is not what was uploaded), and an existing tag
# is not rebuilt (it already names this tree). It pushes ONE name, sous-chef-mx, and never touches sous-chef-lab,
# sous-chef-trainer or the sous-chef-model repository.
substitutions:
  _TAG: ""
  _PROJECT_ID: breadstack-sous-chef-int
  _REGION: northamerica-northeast2
  _AR_REPO: sous-chef

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: mx-check
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        REPO="$_REGION-docker.pkg.dev/$_PROJECT_ID/$_AR_REPO/sous-chef-mx"
        case "$$REPO" in */sous-chef/sous-chef-mx) ;; *) echo "refusing to push to $$REPO"; exit 2 ;; esac
        # a tool cache anywhere in the lab (lab/tools/.ruff_cache, a pytest cache) would enter the tag and the image:
        # images.gcloudignore and images/trainer/tag.sh exclude only lab/.ruff_cache and lab/.pytest_cache
        if find lab images -type d \( -name .ruff_cache -o -name .pytest_cache \) | grep -q .; then
          echo "tool caches in the uploaded tree: delete them (docs/MISTRAL.md §10, step 1) and resubmit"; exit 2
        fi
        T=$$(bash images/mx/tag.sh)
        case "$$T" in m-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;; *) echo "bad tag $$T"; exit 2 ;; esac
        if [ -n "$_TAG" ] && [ "$_TAG" != "$$T" ]; then
          echo "_TAG $_TAG is not the uploaded tree's content tag $$T (images/mx/tag.sh): refusing"; exit 2
        fi
        NEED=true
        if gcloud artifacts docker images describe "$$REPO:$$T" --project "$_PROJECT_ID" >/dev/null 2>&1; then NEED=false; fi
        printf 'REPO=%s\nT=%s\nNEED=%s\n' "$$REPO" "$$T" "$$NEED" | tee /workspace/mx.env

  # docker:29 (Docker 29.8 CLI with buildx), pinned by its index digest, on a 2026.09 worker (Engine 29): the root
  # cloudbuild.yaml's header says why.
  - name: gcr.io/cloud-builders/docker@sha256:6c9d05f41f8e721e05f7d3d1b5c29904ac2595d1b67de093f59420b6e8146ecf
    id: mx-build
    waitFor: ['mx-check']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/mx.env
        if [ "$$NEED" != true ]; then echo "$$REPO:$$T exists: this tree is built; not rebuilding"; exit 0; fi
        docker build --platform linux/amd64 --provenance=false --sbom=false -f images/mx/Dockerfile -t "$$REPO:$$T" .
        docker run --rm "$$REPO:$$T" selftest --no-gpu
        docker push "$$REPO:$$T"
        docker image inspect -f '{{index .RepoDigests 0}}' "$$REPO:$$T"

timeout: 3600s
options:
  workerRelease: "2026.09" # Docker Engine 29
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
