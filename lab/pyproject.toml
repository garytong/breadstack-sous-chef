# Sous Chef lab — the in-house model kit (docs/LAB.md §1).
#
# Runtime is the standard library only: the manifest loader, the EditorState
# builder, the engine wrapper (a subprocess around the browser engine's
# headless.mjs) and the case generator run on any Python >= 3.12 with no
# third-party package. Extras:
#   [dev]    pytest — `make -C lab test`
#   [train]  torch / unsloth / trl / peft / datasets — train.py, dpo.py,
#            export.py import them inside run() only; `--dry-run` never does.
#            Versions follow the thermometer kit's measured set
#            (breadstack-thermometer/lab/in-house-model/pyproject.toml,
#            Unsloth 2026.9.11 / Transformers 5.5.0 / Torch 2.12.1+cu130).
#            `make -C lab train-env` installs them into lab/.venv-train
#            (Python 3.12 via uv) pinned by train-constraints.txt — the
#            `uv pip freeze` of the thermometer venv that trained the 9B on
#            this workstation's RTX 5090 — with torch from PyTorch's cu130
#            index (PyPI's default torch wheel is not the measured build).
#            See docs/TRAIN-WORKSTATION.md.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "souschef-lab"
version = "0.1.0"
description = "Sous Chef lab: cases, collector, verifier and training recipe for the in-house editor model."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.4"]
train = [
    "unsloth==2026.9.11",
    "unsloth-zoo==2026.9.7",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "transformers==5.5.0",
    "trl==0.24.0",
    "datasets>=4.2,<4.4",
    "peft>=0.18.0",
    "accelerate>=1.10.0",
    "bitsandbytes>=0.47.0",
    "xformers>=0.0.35",
    # Gated DeltaNet fast kernels (pure Triton); the thermometer's measured
    # venv had 0.5.2 installed — without it Unsloth injects its vendored fla
    # 0.5.1 snapshot and transformers falls back to PyTorch for the rest.
    "flash-linear-attention==0.5.2",
]

[project.scripts]
souschef-lab = "souschef_lab.cli:main"

[tool.setuptools]
packages = ["souschef_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "engine: needs node >= 20 and the cookie-cutter headless engine (skipped otherwise; SOUS_CHEF_LAB_REQUIRE_ENGINE=1 turns the skip into a failure)",
]
